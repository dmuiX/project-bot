name: project-bot

services:
  project-bot:
    build: ..
    container_name: project-bot
    ports:
      - "8002:8002"
    environment:
      # Timezone configuration
      - TZ=Europe/Berlin
      # API Keys - Set these in your .env file
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - FREELANCE_USERNAME=${FREELANCE_USERNAME}
      - FREELANCE_PASSWORD=${FREELANCE_PASSWORD}
      # Optional: Additional API keys if you use multiple Anthropic keys
      - ANTHROPIC_API_KEY2=${ANTHROPIC_API_KEY2:-$ANTHROPIC_API_KEY}
      # Flask settings (bind 0.0.0.0 inside container so host port mapping works)
      - FLASK_ENV=production
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=8002
      # Logging configuration
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE=/app/logs/app.log
      - LOG_ROTATION_WHEN=MIDNIGHT
      - LOG_BACKUP_COUNT=10
    volumes:
      # Persistent runtime data (aligned with docker/docker-setup.sh)
      - ../data:/app/data
      - ../projects:/app/projects
      - ../logs:/app/logs
      # Mount config file from project root (ensure source file exists)
      - ../config.yaml:/app/config.yaml:ro
      # Optional: Mount custom local profile & rule overrides without committing them to Git
      # - ../local-profile/competency_profiles:/app/competency_profiles:ro
      # - ../local-profile/suitability_rules.yaml:/app/suitability_rules.yaml:ro
      # - ../local-profile/search_group_filters.yaml:/app/search_group_filters.yaml:ro
    restart: unless-stopped
    # Multi-architecture support - will use native architecture by default
    # For multi-arch builds, use: docker buildx build --platform linux/amd64,linux/arm64