apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "project-bot.fullname" . }}
  labels:
    {{- include "project-bot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "project-bot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "project-bot.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
          {{- with .Values.env }}
          env:
            {{- range $key, $val := . }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          {{- end }}
          {{- if .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: storage
              mountPath: /app/data
              subPath: data
            - name: storage
              mountPath: /app/projects
              subPath: projects
            - name: storage
              mountPath: /app/logs
              subPath: logs
            {{- end }}
            {{- if .Values.customConfig.configMapName }}
            {{- if .Values.customConfig.mountConfigYaml }}
            - name: custom-config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            {{- end }}
            {{- if .Values.customConfig.mountSuitabilityRules }}
            - name: custom-config
              mountPath: /app/suitability_rules.yaml
              subPath: suitability_rules.yaml
              readOnly: true
            {{- end }}
            {{- if .Values.customConfig.mountSearchGroupFilters }}
            - name: custom-config
              mountPath: /app/search_group_filters.yaml
              subPath: search_group_filters.yaml
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if .Values.customConfig.profilesConfigMapName }}
            - name: custom-profiles
              mountPath: /app/competency_profiles
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: storage
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-storage" (include "project-bot.fullname" .)) }}
        {{- end }}
        {{- if .Values.customConfig.configMapName }}
        - name: custom-config
          configMap:
            name: {{ .Values.customConfig.configMapName }}
        {{- end }}
        {{- if .Values.customConfig.profilesConfigMapName }}
        - name: custom-profiles
          configMap:
            name: {{ .Values.customConfig.profilesConfigMapName }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
