name: Helm Chart Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "charts/**"
      - ".github/workflows/helm-publish.yml"
  pull_request:
    branches:
      - main
    paths:
      - "charts/**"
      - ".github/workflows/helm-publish.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  CHART_PATH: charts/project-bot

permissions:
  contents: read

jobs:
  lint-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Lint Helm chart
        run: helm lint "${{ env.CHART_PATH }}"

      - name: Validate rendered templates
        run: |
          helm template project-bot "${{ env.CHART_PATH }}" > /dev/null
          # Existing ConfigMaps + Secret + HTTPRoute
          helm template project-bot "${{ env.CHART_PATH }}" \
            --set existingSecret=project-bot-secrets \
            --set customConfig.existingConfigMap=project-bot-config \
            --set customConfig.mountSuitabilityRules=true \
            --set customConfig.mountSearchGroupFilters=true \
            --set customConfig.existingProfilesConfigMap=project-bot-profiles \
            --set httpRoute.enabled=true \
            --set 'httpRoute.parentRefs[0].name=main-gateway' \
            --set 'httpRoute.hostnames[0]=project-bot.example.local' > /dev/null
          # Inline ConfigMaps + Secret
          helm template project-bot "${{ env.CHART_PATH }}" \
            --set 'secrets.OPENAI_API_KEY=dummy' \
            --set 'customConfig.configYaml=llm: {}' \
            --set 'customConfig.suitabilityRulesYaml=suitability: {}' \
            --set 'customConfig.searchGroupFiltersYaml=search_group_filters: {}' \
            --set 'customConfig.profiles.devops\.md=# DevOps' > /dev/null

      - name: Compute chart version and OCI target
        id: meta
        if: github.event_name != 'pull_request'
        run: |
          OWNER_LOWER="${GITHUB_REPOSITORY_OWNER,,}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BASE_VERSION=$(awk '/^version:/ {gsub(/"/, "", $2); print $2}' "${{ env.CHART_PATH }}/Chart.yaml")

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            CHART_VERSION="$TAG"
            APP_VERSION="$TAG"
          else
            CHART_VERSION="${BASE_VERSION}-sha.${SHORT_SHA}"
            APP_VERSION="sha-${SHORT_SHA}"
          fi

          echo "owner_lower=${OWNER_LOWER}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "oci_repo=oci://${{ env.REGISTRY }}/${OWNER_LOWER}/charts" >> "$GITHUB_OUTPUT"

      - name: Log into GHCR for Helm OCI
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login "${{ env.REGISTRY }}" \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Package and push OCI Helm chart
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          helm package "${{ env.CHART_PATH }}" \
            --version "${{ steps.meta.outputs.chart_version }}" \
            --app-version "${{ steps.meta.outputs.app_version }}" \
            --destination dist
          helm push "dist/project-bot-${{ steps.meta.outputs.chart_version }}.tgz" \
            "${{ steps.meta.outputs.oci_repo }}"

      - name: Job summary
        if: always() && github.event_name != 'pull_request'
        run: |
          {
            echo "### Helm Chart OCI Publish"
            echo ""
            echo "- Chart: \`${{ steps.meta.outputs.oci_repo }}/project-bot\`"
            echo "- Version: \`${{ steps.meta.outputs.chart_version }}\`"
            echo "- AppVersion: \`${{ steps.meta.outputs.app_version }}\`"
            echo ""
            echo '```bash'
            echo "helm upgrade --install project-bot ${{ steps.meta.outputs.oci_repo }}/project-bot --version ${{ steps.meta.outputs.chart_version }} -n project-bot --create-namespace"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
