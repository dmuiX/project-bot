name: Docker Publish

on:
  push:
    branches:
      - main
    paths-ignore:
      - "charts/**"
      - ".github/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lowercase image name
        id: lowercase
        run: echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_name }}
          tags: |
            type=raw,value=latest

      - name: Build and load test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: localhost/${{ steps.lowercase.outputs.image_name }}:test
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: localhost/${{ steps.lowercase.outputs.image_name }}:test
          format: "table"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          # Set to "1" to block publishing on fixable HIGH/CRITICAL CVEs.
          exit-code: "0"

      - name: Smoke-test container health and frontend
        run: |
          docker run -d --name project-bot-test \
            -p 127.0.0.1:8002:8002 \
            "localhost/${{ steps.lowercase.outputs.image_name }}:test"

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8002/api/v1/health; then
              echo ""
              echo "Health endpoint OK"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Container failed health check"
              docker logs project-bot-test
              exit 1
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8002/ | grep -i "<html" > /dev/null
          echo "Frontend root endpoint OK"

      - name: Clean up test container
        if: always()
        run: docker rm -f project-bot-test || true

      - name: Build and push release image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          sbom: true
          provenance: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign published image with Cosign
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          IMAGE_URI="${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_name }}@${DIGEST}"
          cosign sign --yes "$IMAGE_URI"

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Docker Image Publish"
            echo ""
            echo "- Immutable reference (digest): \`${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_name }}@${{ steps.build-and-push.outputs.digest }}\`"
            echo "- Digest: \`${{ steps.build-and-push.outputs.digest }}\`"
            echo "- Tag: \`latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
